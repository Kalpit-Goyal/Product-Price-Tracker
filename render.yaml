# Render blueprint for the INE price tracker API.
#
# Deploy with: Render dashboard -> New -> Blueprint -> point at this repo, or
# `render blueprint launch` from the CLI.
#
# Every value under `envVars` with `sync: false` is a SECRET you must set in the
# Render dashboard. They are deliberately not given defaults: a committed default
# secret is a leaked secret, and config.js refuses to boot on a short one anyway.
#
# ---------------------------------------------------------------------------
# THE FREE TIER WILL BREAK THE SCHEDULE. READ THIS BEFORE DEPLOYING.
# ---------------------------------------------------------------------------
# Render's free web services are idled after ~15 minutes of inactivity, and a
# cold start takes roughly 50 seconds. This project runs on a 2-hourly cron, which
# means the service is ALWAYS asleep when the cron fires. Two consequences:
#
#   1. The cold start eats most of the request budget before the scrape begins.
#   2. The in-memory search index is gone on every wake, so the first search pays
#      the ~60-75s rebuild (see backend/src/services/catalog.js).
#
# Two fixes, and you need BOTH:
#   a) Use a paid instance type, or
#   b) Keep the service awake with a separate ping that runs far more often than
#      the cron. The /api/health endpoint is cheap and now also kicks off a
#      background index rebuild, which is exactly what you want on a wake-up.
#      Set the keep-warm ping to every 10 minutes via cron-job.org or UptimeRobot.
#      Do NOT rely on the 2-hourly scrape job to do this -- it is far too sparse.
#
# Playwright note: the free plan also caps memory at 512MB. One Chromium context
# fits; a full 958-product sweep does not run in one process comfortably. The
# scraper is written to be resumable so a long sweep can be run in batches.
services:
  - type: web
    name: ine-price-tracker-api
    runtime: node
    plan: starter # free | starter. See the note above before choosing 'free'.
    region: singapore # closest to the store; keeps scrape latency down
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    # NOTE: render.yaml only supports `healthCheckPath`. The interval, timeout and
    # failure threshold are NOT blueprint keys -- set them in the Render dashboard
    # under Health Check Path. Suggested values, and why:
    #   interval 30s / timeout 10s / failure threshold 3
    # A shorter failure threshold restarts the service while a 6-attempt scrape is
    # mid-retry, which throws away the run. A long-interval health check would not
    # notice a genuinely wedged process.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SCRAPE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: HEADLESS
        value: 1
      - key: SLOWMO_MS
        value: 0
      - key: SCRAPE_TIMEOUT_MS
        value: 30000
      - key: SCRAPE_MAX_ATTEMPTS
        value: 6
      - key: SCRAPE_CONCURRENCY
        value: 1
      - key: LOG_LEVEL
        value: info
      # Restrict to the Vercel frontend origin in production. * is fine locally.
      - key: ALLOWED_ORIGIN
        sync: false

      # ---- SECRETS: set these in the dashboard, never commit them -------------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true # Render generates it; copy it into cron-job.org
